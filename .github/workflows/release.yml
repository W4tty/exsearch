name: release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ExSearch
        run: gradle clean build --stacktrace

      - name: Publish and synchronize v1.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="1.1.0"
          TAG="v${VERSION}"
          JAR="$(find build/libs -maxdepth 1 -type f -name "exsearch-${VERSION}.jar" | head -n 1)"
          test -n "$JAR"

          NOTES="ExSearch v1.1.0 adds a real color-theory palette engine. Search installed blocks using auto, monochromatic, analogous, complementary, split-complementary, triadic, tetradic, neutral, or accent harmony modes, then narrow results by builder role such as wall, floor, trim, light, panel, glass, storage, or machine. Harmony ranking uses runtime visual color data plus semantic material/style/use information. Minecraft 1.21.1 / NeoForge 21.1.234 / Java 21."

          git tag -f "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "ExSearch v${VERSION}" --notes "$NOTES" --target "$GITHUB_SHA"
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "ExSearch v${VERSION}" --notes "$NOTES"
          fi
