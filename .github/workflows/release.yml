name: release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Aero Search
        run: gradle clean build --stacktrace

      - name: Publish v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          test -n "$JAR"

          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 "$JAR" --clobber
          else
            gh release create v1.0.0 "$JAR" \
              --target "${GITHUB_SHA}" \
              --title "Aero Search v1.0.0" \
              --notes "Production build for Minecraft Java 1.21.1 / NeoForge 21.1.234 / Java 21. Includes JEI-style Creative search operators, semantic builder filters, fuzzy matching, visual/color indexing, similarity search, palette search, autocomplete, local adaptive ranking, and bundled metadata enrichment."
          fi
